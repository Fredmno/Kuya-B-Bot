<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <title>Kuya B</title>

    <link rel="stylesheet" href="/app/style.css?v=2"/>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<main class="app">

    <section class="card" id="dashboardPage">

        <header class="header">

            <div>
                <div class="greeting">
                    Welcome back 👋
                </div>

                <h1>Kuya B</h1>

                <p>Your personal hub</p>
            </div>

            <div class="avatar">🤖</div>
        </header>


        <button class="search-bar" id="searchButton">
            <span>🔍</span>
            <span class="search-text">
                Search your vault...
            </span>
        </button>


        <section class="section">

            <h2>Personal</h2>

            <div class="grid">

                <button class="tile tile-blue"
                        data-feature="daily">
                    <span class="icon">📅</span>
                    <strong>Daily Logs</strong>
                    <small>Your days</small>
                </button>

                <button class="tile tile-green"
                        data-feature="tasks">
                    <span class="icon">✅</span>
                    <strong>Tasks</strong>
                    <small>Get things done</small>
                </button>

                <button class="tile tile-orange"
                        data-feature="reminders">
                    <span class="icon">⏰</span>
                    <strong>Reminders</strong>
                    <small>Don't forget</small>
                </button>

                <button class="tile tile-pink"
                        data-feature="birthdays">
                    <span class="icon">🎂</span>
                    <strong>Birthdays</strong>
                    <small>Important dates</small>
                </button>

            </div>
        </section>
        <section class="section">

            <h2>Media &amp; Content</h2>

            <div class="grid">

                <button class="tile tile-purple"
                        data-feature="videos">
                    <span class="icon">🎥</span>
                    <strong>Videos</strong>
                    <small>Your video vault</small>
                </button>

                <button class="tile tile-cyan"
                        data-feature="pictures">
                    <span class="icon">🖼️</span>
                    <strong>Pictures</strong>
                    <small>Your photo vault</small>
                </button>

                <button class="tile tile-gray"
                        data-feature="other">
                    <span class="icon">📚</span>
                    <strong>Other</strong>
                    <small>Everything else</small>
                </button>

                <button class="tile tile-dark"
                        data-feature="search">
                    <span class="icon">🔎</span>
                    <strong>Search</strong>
                    <small>Find anything</small>
                </button>

            </div>

        </section>


        <button class="add-button"
                id="addContentButton">

            <span>＋</span>
            Add Content

        </button>


        <button class="game-button"
                id="gameButton">

            <span>🎮</span>

            <div>
                <strong>Word Scramble</strong>
                <small>Take a quick break</small>
            </div>

            <span class="arrow">›</span>

        </button>


        <footer>
            <span>🤖 Kuya B</span>
            <span>Personal Hub</span>
        </footer>

    </section>


    <!-- BIRTHDAYS PAGE -->

    <section class="card" id="birthdaysPage"
             style="display:none;">

        <header class="header">

            <div>
                <div class="greeting">
                    Personal
                </div>

                <h1>🎂 Birthdays</h1>

                <p>Important dates</p>
            </div>

            <div class="avatar">🎂</div>

        </header>


        <button class="search-bar"
                id="birthdayBackButton">

            <span>←</span>

            <span class="search-text">
                Back to Kuya B
            </span>

        </button>


        <div id="birthdayList"
             style="margin-top:20px;">

            <div style="
                text-align:center;
                color:#94a3b8;
                padding:30px;
            ">
                Loading birthdays...
            </div>

        </div>
        <button class="add-button"
                id="addBirthdayButton">

            <span>＋</span>
            Add Birthday

        </button>


        <div id="birthdayForm"
             style="
                display:none;
                margin-top:16px;
                background:#1e293b;
                border-radius:18px;
                padding:20px;
             ">

            <h2>Add Birthday</h2>


            <label for="birthdayName">
                Name
            </label>

            <input
                id="birthdayName"
                type="text"
                placeholder="Example: Mom"
                autocomplete="off"
            >


            <label for="birthdayDate">
                Birthday
            </label>

            <input
                id="birthdayDate"
                type="text"
                placeholder="MM-DD"
                maxlength="5"
                autocomplete="off"
            >


            <button
                class="add-button"
                id="saveBirthdayButton">

                Save Birthday

            </button>


            <button
                id="cancelBirthdayButton">

                Cancel

            </button>

        </div>

    </section>

    <!-- DAILY LOGS PAGE -->
    <section class="card" id="dailyLogsPage" style="display:none;">

        <header class="header">
            <div>
                <div class="greeting">Personal</div>
                <h1>📅 Daily Logs</h1>
                <p>Record your days</p>
            </div>
            <div class="avatar">📅</div>
        </header>

        <button class="search-bar" id="dailyLogsBackButton">
            <span>←</span>
            <span class="search-text">Back to Kuya B</span>
        </button>

        <button class="add-button" id="addLogButton" style="margin-top: 14px;">
            <span>＋</span>
            New Log Entry
        </button>

        <!-- ADD / EDIT LOG FORM -->
        <div id="logForm" style="display:none; margin-top:16px; background:#1e293b; border-radius:18px; padding:20px;">
            <h2 id="logFormHeading">New Entry</h2>

            <label for="logDate">Date</label>
            <input id="logDate" type="date">

            <label>Mood</label>
            <div id="moodSelector" style="display: flex; gap: 8px; margin-bottom: 14px; margin-top: 6px;">
                <button type="button" class="mood-btn" data-mood="😊" style="font-size: 1.5rem; background: rgba(255,255,255,0.08); border: 2px solid transparent; border-radius: 12px; padding: 6px 12px; cursor: pointer;">😊</button>
                <button type="button" class="mood-btn" data-mood="⚡" style="font-size: 1.5rem; background: rgba(255,255,255,0.08); border: 2px solid transparent; border-radius: 12px; padding: 6px 12px; cursor: pointer;">⚡</button>
                <button type="button" class="mood-btn" data-mood="😌" style="font-size: 1.5rem; background: rgba(255,255,255,0.08); border: 2px solid transparent; border-radius: 12px; padding: 6px 12px; cursor: pointer;">😌</button>
                <button type="button" class="mood-btn" data-mood="😴" style="font-size: 1.5rem; background: rgba(255,255,255,0.08); border: 2px solid transparent; border-radius: 12px; padding: 6px 12px; cursor: pointer;">😴</button>
                <button type="button" class="mood-btn" data-mood="🌧️" style="font-size: 1.5rem; background: rgba(255,255,255,0.08); border: 2px solid transparent; border-radius: 12px; padding: 6px 12px; cursor: pointer;">🌧️</button>
            </div>

            <label for="logText">What's on your mind?</label>
            <textarea id="logText" rows="4" placeholder="Write about your day, progress, thoughts..." style="width: 100%; border-radius: 12px; padding: 12px; background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.1); margin-top: 6px; margin-bottom: 14px; font-family: inherit; font-size: 0.95rem; resize: vertical; box-sizing: border-box;"></textarea>

            <button class="add-button" id="saveLogButton">Save Entry</button>
            <button type="button" id="cancelLogButton" style="width: 100%; background: none; border: none; color: #94a3b8; padding: 10px; margin-top: 8px; cursor: pointer;">Cancel</button>
        </div>

        <!-- LOGS LIST CONTAINER -->
        <div id="logsList" style="margin-top:20px;">
            <div style="text-align:center; color:#94a3b8; padding:30px;">
                Loading logs...
            </div>
        </div>

    </section>


</main>

<script type="module" src="/app/app.js?v=5"></script>

</body>
</html>
