<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuya B Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/app/features/stylesheet/dashboard.css?v=1.0.2">
</head>
<body>
    <div id="app">
        <!-- Kuya B — Personal Hub Dashboard View -->
        <div id="dashboard-view" class="dashboard-container">
            <!-- Personal Hub Header Row with Inline Admin Button -->
            <div class="personal-hub-header">
                <div class="hub-profile-info">
                    <div class="hub-avatar">👤</div>
                    <div class="hub-text">
                        <h1 class="hub-title">Your Personal Hub</h1>
                        <p class="hub-subtitle">Manage your daily tasks & tools</p>
                    </div>
                </div>

                <!-- Admin Button -> Routes directly to Admin Panel -->
                <button type="button" class="btn-admin-header" id="btnAdminPanel" onclick="window.openAdminPanel ? window.openAdminPanel() : alert('Opening Admin Panel...')">
                    ⚡ Admin
                </button>
            </div>
        </div>
    </div>
</body>
</html>
