<!-- Kuya B — Simplified Single-Box GitHub Form Submitter -->
<div id="githubFormPage" class="github-form-container" style="display: none; padding: 14px 16px 30px;">
    <!-- Top Header Bar with Cancel & Submit Actions -->
    <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <h2 style="font-size: 1.1rem; font-weight: 700; color: #1e293b; margin: 0;">🐙 GitHub Form</h2>
        </div>
        <div style="display: flex; gap: 8px;">
            <button type="button" class="btn-soft cancel" onclick="window.cancelGitHubForm()" style="border: none; background: #e2e8f0; color: #475569; font-size: 0.82rem; font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer;">Cancel</button>
            <button type="button" class="btn-soft save" id="btnSubmitGitHubForm" onclick="window.KuyaB.submitGitHubFormCommit()" style="border: none; background: #2563eb; color: #ffffff; font-size: 0.82rem; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 6px rgba(37,99,235,0.25);">Submit</button>
        </div>
    </div>

    <!-- Payload Status Indicator -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <label style="font-size: 0.82rem; font-weight: 700; color: #475569;">Paste Commit JSON Payload</label>
        <span id="githubFileLoadStatus" style="font-size: 0.75rem; color: #2563eb; font-weight: 600;"></span>
    </div>

    <!-- Single JSON Input Box -->
    <textarea 
        class="neu-input" 
        id="githubCommitContentInput" 
        placeholder='Paste full JSON commit block here, e.g.:

{
  "action": "commit_file",
  "path": "webapp/core/routes.py",
  "message": "fix: update endpoints",
  "content": "..."
}' 
        rows="8" 
        style="width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1; background: #f8fafc; color: #1e293b; font-family: monospace; font-size: 0.82rem; line-height: 1.45; white-space: pre; outline: none; resize: vertical; min-height: 150px;"
    ></textarea>
</div>
