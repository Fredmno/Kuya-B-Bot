<!-- Admin Top-Right Small Button -->
<button id="admin-panel-btn" class="admin-top-btn" type="button" style="display: none;" onclick="openAdminPanel()">
    ⚙️ Admin
</button>

<!-- Admin Panel Full View Container -->
<div id="admin-panel-view" class="view-container" style="display: none;">
    <div class="view-header">
        <button type="button" class="btn-back" onclick="closeAdminPanel()">← Back</button>
        <h2>Admin Management</h2>
    </div>

    <div class="admin-card-grid">
        <button type="button" class="admin-card" onclick="openRenderStatusView()">
            <div class="icon">🟢</div>
            <div class="title">Deploy</div>
        </button>

        <button type="button" class="admin-card" onclick="openCommitterView()">
            <div class="icon">✏️</div>
            <div class="title">Committer</div>
        </button>

        <button type="button" class="admin-card" onclick="window.fetchRepoTree ? window.fetchRepoTree() : null">
            <div class="icon">📁</div>
            <div class="title">Tree</div>
        </button>

        <button type="button" class="admin-card" onclick="window.KuyaB && window.KuyaB.renderStatus ? window.KuyaB.renderStatus.check() : null">
            <div class="icon">🩺</div>
            <div class="title">Health</div>
        </button>
    </div>
</div>
