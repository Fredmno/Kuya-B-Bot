<!-- Admin Top-Right Small Button -->
<button id="admin-panel-btn" class="admin-top-btn" type="button" style="display: none;" onclick="openAdminPanel()">
    ⚙️ Admin
</button>

<!-- Admin Panel Full View Container -->
<div id="admin-panel-view" class="view-container" style="display: none;">
    <div class="view-header">
        <button type="button" class="btn-back" onclick="closeAdminPanel()">← Back</button>
        <h2>Admin Management</h2>
    </div>

    <div class="admin-card-grid">
        <button type="button" class="admin-card" onclick="openRenderStatusView()">
            <div class="icon">🟢</div>
            <div class="title">Deployments</div>
            <div class="desc">Render status & history</div>
        </button>

        <button type="button" class="admin-card" onclick="triggerRegenerateTree()">
            <div class="icon">📁</div>
            <div class="title">STRUCTURE.md</div>
            <div class="desc">Sync directory tree</div>
        </button>

        <button type="button" class="admin-card" onclick="checkServerHealth()">
            <div class="icon">🩺</div>
            <div class="title">Server Health</div>
            <div class="desc">Verify backend API</div>
        </button>
    </div>
</div>
