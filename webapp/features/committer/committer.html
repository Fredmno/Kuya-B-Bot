<!-- Kuya B — File Committer Feature View (Neumorphic) -->
<div id="committer-view" class="view-container neu-view" style="display: none; padding-bottom: 30px;">
    <div class="view-header">
        <button type="button" class="neu-btn neu-btn-sm" onclick="closeCommitterView()">← Back</button>
        <h2 class="neu-title">⚡ File Committer</h2>
        <button type="button" class="neu-btn neu-btn-sm" onclick="window.KuyaB.loadRepoTree()" title="Refresh file list">🔄 Refresh</button>
    </div>

    <!-- Search File with Autocomplete Dropdown -->
    <div class="neu-form-group" style="position: relative; margin-top: 14px;">
        <div class="neu-label-row">
            <label for="fileSearchInput" class="neu-label">Search File Name</label>
            <span id="repoScanStatus" class="neu-subtext">Loading files...</span>
        </div>
        <input 
            type="text" 
            id="fileSearchInput" 
            class="neu-input" 
            placeholder="Type to search repo files (e.g. routes.py)..."
            autocomplete="off"
            oninput="window.KuyaB.filterRepoFiles(this.value)"
            onfocus="window.KuyaB.filterRepoFiles(this.value)"
        />
        
        <!-- Dropdown Suggestion List -->
        <div id="fileSuggestionsList" class="neu-dropdown" style="display: none;"></div>
    </div>

    <!-- Target File Path -->
    <div class="neu-form-group" style="margin-top: 14px;">
        <label for="commitFilePath" class="neu-label">Target File Path</label>
        <input 
            type="text" 
            id="commitFilePath" 
            class="neu-input" 
            placeholder="webapp/core/routes.py" 
        />
    </div>

    <!-- Commit Message -->
    <div class="neu-form-group" style="margin-top: 14px;">
        <label for="commitMsgInput" class="neu-label">Commit Message</label>
        <input 
            type="text" 
            id="commitMsgInput" 
            class="neu-input" 
            placeholder="feat: update routes" 
        />
    </div>

    <!-- File Content Editor -->
    <div class="neu-form-group" style="margin-top: 14px;">
        <div class="neu-label-row">
            <label for="commitContentInput" class="neu-label">File Content</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <span id="fileLoadStatus" class="neu-badge-info"></span>
                <button type="button" class="neu-btn neu-btn-xs" onclick="window.KuyaB.pasteCommitterContent()">📋 Paste</button>
                <button type="button" class="neu-btn neu-btn-xs" onclick="window.KuyaB.clearCommitterContent()">🗑️ Clear</button>
            </div>
        </div>
        <textarea 
            id="commitContentInput" 
            class="neu-textarea" 
            placeholder="# Paste updated code here..."
        ></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="neu-btn-row" style="margin-top: 18px;">
        <button type="button" class="neu-btn neu-btn-cancel" onclick="closeCommitterView()">Cancel</button>
        <button type="button" id="btnSubmitCommit" class="neu-btn neu-btn-submit" onclick="window.KuyaB.submitFileCommit()">Commit & Deploy 🚀</button>
    </div>
</div>
