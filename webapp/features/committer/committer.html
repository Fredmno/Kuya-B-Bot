<!-- Kuya B — File Committer Feature View -->
<div id="committer-view" class="view-container" style="display: none;">
    <div class="view-header">
        <button type="button" class="btn-back" onclick="closeCommitterView()">← Back</button>
        <h2>File Committer</h2>
        <button type="button" class="btn-action-small" onclick="fetchRepoTree()">🔄 Refresh</button>
    </div>

    <!-- Live Typing / Auto-suggest File Input -->
    <div class="committer-section">
        <label class="committer-label" for="committerFilePath">Target File (Type to filter)</label>
        <input 
            type="text" 
            id="committerFilePath" 
            list="repoFileList"
            class="committer-text-input" 
            placeholder="Type file path (e.g., admin_panel.css)..."
            autocomplete="off"
            spellcheck="false"
            oninput="handleFilePathInput(this.value)"
        >
        <datalist id="repoFileList"></datalist>
    </div>

    <!-- Commit Message Input -->
    <div class="committer-section">
        <label class="committer-label" for="committerCommitMsg">Commit Message</label>
        <input 
            type="text" 
            id="committerCommitMsg" 
            class="committer-text-input" 
            placeholder="e.g. style(admin_panel): update action grid"
            autocomplete="off"
        >
    </div>

    <!-- File Content Editor -->
    <div class="committer-section">
        <div class="editor-header-bar">
            <label class="committer-label" for="committerContent">File Content</label>
            <span id="committerFileStatus" class="editor-status-tag">Ready</span>
        </div>
        <textarea 
            id="committerContent" 
            class="committer-textarea" 
            placeholder="Paste or write your updated code/markup here..." 
            spellcheck="false"
        ></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="committer-actions-grid">
        <button type="button" class="btn-committer-secondary" onclick="clearCommitterForm()">Clear</button>
        <button type="button" id="btnSubmitCommit" class="btn-committer-primary" onclick="submitCommit()">🚀 Push Commit</button>
    </div>
</div>
