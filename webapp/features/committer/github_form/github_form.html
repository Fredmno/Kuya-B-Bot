<!-- Kuya B — GitHub Form Component -->
<div id="githubFormPage" class="github-form-container" style="display: none; padding-bottom: 30px;">
    <div class="top-bar">
        <button type="button" class="btn-icon-back" id="githubFormBackButton">←</button>
        <h2>🐙 GitHub Form</h2>
        <button type="button" class="btn-icon-add" onclick="window.KuyaB.loadGitHubRepoTree(true)" title="Refresh file list">🔄</button>
    </div>

    <div class="form-box" style="display: block; margin-top: 14px; position: relative;">
        <!-- File Search / Autocomplete -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="font-size: 0.82rem; font-weight: 600; color: #64748b;">Search or Pick Existing File</label>
            <span id="githubRepoScanStatus" style="font-size: 0.75rem; color: #2563eb; font-weight: 600;"></span>
        </div>

        <div style="position: relative; margin-bottom: 14px; z-index: 50;">
            <input 
                type="text" 
                class="neu-input" 
                id="githubFileSearchInput" 
                placeholder="Search repo file (e.g. routes.py, bot.py)..." 
                autocomplete="off"
                oninput="window.KuyaB.filterGitHubRepoFiles(this.value)"
                onfocus="window.KuyaB.filterGitHubRepoFiles(this.value)"
                style="width: 100%; box-sizing: border-box;"
            >
            <!-- Dropdown suggestions -->
            <div id="githubFileSuggestionsList" style="
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                max-height: 220px;
                overflow-y: auto;
                background: #f1f5f9;
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.18), inset 1px 1px 2px #ffffff;
                z-index: 9999;
                margin-top: 6px;
                border: 1px solid #cbd5e1;
                box-sizing: border-box;
            "></div>
        </div>

        <!-- Target File Path -->
        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Target File Path</label>
        <input type="text" class="neu-input" id="githubCommitFilePath" placeholder="e.g. webapp/core/routes.py" style="margin-bottom: 14px;">

        <!-- Commit Message -->
        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Commit Message</label>
        <input type="text" class="neu-input" id="githubCommitMsgInput" placeholder="e.g. fix: update API endpoints" style="margin-bottom: 14px;">

        <!-- Content Editor Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <label style="font-size: 0.82rem; font-weight: 600; color: #64748b;">File Content or JSON Payload</label>
                <span id="githubFileLoadStatus" style="font-size: 0.72rem; color: #2563eb; font-weight: 600;"></span>
            </div>
            <div style="display: flex; gap: 6px;">
                <button type="button" onclick="window.KuyaB.clearGitHubFormContent()" style="
                    border: none;
                    background: #e2e8f0;
                    color: #475569;
                    font-size: 0.72rem;
                    font-weight: 600;
                    padding: 3px 8px;
                    border-radius: 6px;
                    cursor: pointer;
                    box-shadow: 1px 1px 3px rgba(0,0,0,0.08);
                ">🗑️ Clear</button>
                <button type="button" onclick="window.KuyaB.pasteGitHubFormContent()" style="
                    border: none;
                    background: #2563eb;
                    color: #ffffff;
                    font-size: 0.72rem;
                    font-weight: 600;
                    padding: 3px 8px;
                    border-radius: 6px;
                    cursor: pointer;
                    box-shadow: 1px 1px 3px rgba(37,99,235,0.3);
                ">📋 Paste JSON</button>
            </div>
        </div>

        <!-- Content / JSON Textarea -->
        <textarea 
            class="neu-input" 
            id="githubCommitContentInput" 
            placeholder="Paste complete JSON snippet here to auto-fill, or type code directly..." 
            rows="13" 
            style="font-family: monospace; font-size: 0.8rem; line-height: 1.4; white-space: pre;"
        ></textarea>

        <div class="form-actions" style="margin-top: 16px;">
            <button type="button" class="btn-soft cancel" id="cancelGitHubFormButton">Cancel</button>
            <button type="button" class="btn-soft save" id="btnSubmitGitHubForm" onclick="window.KuyaB.submitGitHubFormCommit()">Push to GitHub 🚀</button>
        </div>
    </div>
</div>
