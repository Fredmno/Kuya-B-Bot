<!-- Kuya B — Personal Hub Dashboard View -->
<div id="dashboard-view" class="dashboard-container">
    <!-- Personal Hub Header Row with Integrated Admin Button -->
    <div class="personal-hub-header">
        <div class="hub-profile-info">
            <div class="hub-avatar">👤</div>
            <div class="hub-text">
                <h1 class="hub-title">Your Personal Hub</h1>
                <p class="hub-subtitle">Manage your daily tasks & tools</p>
            </div>
        </div>

        <!-- Admin Button: opens the admin panel view -->
        <button type="button" class="btn-admin-header" id="btnAdminPanel" onclick="window.openAdminPanel ? window.openAdminPanel() : (document.getElementById('dashboard-view').style.display='none', document.getElementById('admin-panel-view').style.display='block')">
            ⚡ Admin
        </button>
    </div>

    <!-- Quick Actions / Features Grid -->
    <div class="hub-grid">
        <!-- Direct GitHub Form shortcut -->
        <div class="hub-card" onclick="window.openGitHubFormView ? window.openGitHubFormView() : window.openAdminPanel()">
            <div class="hub-card-icon">🐙</div>
            <div class="hub-card-title">GitHub Form</div>
            <div class="hub-card-desc">Paste JSON or commit code</div>
        </div>

        <!-- Deployments shortcut -->
        <div class="hub-card" onclick="window.openRenderStatusView ? window.openRenderStatusView() : null">
            <div class="hub-card-icon">🟢</div>
            <div class="hub-card-title">Deployments</div>
            <div class="hub-card-desc">Check service health & logs</div>
        </div>

        <!-- Repo Tree shortcut -->
        <div class="hub-card" onclick="window.KuyaB && window.KuyaB.openTreeView ? window.KuyaB.openTreeView() : null">
            <div class="hub-card-icon">🌳</div>
            <div class="hub-card-title">Repo Tree</div>
            <div class="hub-card-desc">Browse repository structure</div>
        </div>
    </div>
</div>
