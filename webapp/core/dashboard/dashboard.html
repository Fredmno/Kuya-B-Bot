<!-- Kuya B — Personal Hub Dashboard View -->
<div id="dashboard-view" class="dashboard-container" style="display: block; padding: 14px 16px 30px;">
    <!-- Personal Hub Header with Inline Admin Button -->
    <div class="personal-hub-header" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; margin-bottom: 16px; background: #e6ecf5; border-radius: 16px; box-shadow: 4px 4px 10px #c5d0e0, -4px -4px 10px #ffffff;">
        <div class="hub-profile-info" style="display: flex; align-items: center; gap: 12px;">
            <div class="hub-avatar" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #e6ecf5; box-shadow: inset 2px 2px 5px #c5d0e0, inset -2px -2px 5px #ffffff;">👤</div>
            <div class="hub-text" style="display: flex; flex-direction: column;">
                <h1 class="hub-title" style="font-size: 15px; font-weight: 700; color: #1e293b; margin: 0; line-height: 1.2;">Your Personal Hub</h1>
                <p class="hub-subtitle" style="font-size: 11px; color: #64748b; margin: 2px 0 0 0;">Manage your daily tasks & tools</p>
            </div>
        </div>

        <!-- Aligned Admin Button -->
        <button type="button" class="btn-admin-header" id="btnAdminPanel" onclick="window.openAdminPanel ? window.openAdminPanel() : (document.getElementById('dashboard-view').style.display='none', document.getElementById('admin-panel-view').style.display='block')" style="border: none; outline: none; background: #e6ecf5; color: #2563eb; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap; box-shadow: 3px 3px 7px #c5d0e0, -3px -3px 7px #ffffff;">
            ⚡ Admin
        </button>
    </div>

    <!-- Quick Actions / Features Grid -->
    <div class="hub-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px;">
        <!-- GitHub Form Shortcut -->
        <div class="hub-card" onclick="window.openGitHubFormView ? window.openGitHubFormView() : (window.openAdminPanel && window.openAdminPanel())" style="background: #e6ecf5; padding: 14px 12px; border-radius: 14px; box-shadow: 4px 4px 9px #c5d0e0, -4px -4px 9px #ffffff; cursor: pointer; text-align: center;">
            <div style="font-size: 22px; margin-bottom: 6px;">🐙</div>
            <div style="font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 3px;">GitHub Form</div>
            <div style="font-size: 10.5px; color: #64748b; line-height: 1.3;">Paste JSON or commit code</div>
        </div>

        <!-- Deployments Shortcut -->
        <div class="hub-card" onclick="window.openRenderStatusView ? window.openRenderStatusView() : null" style="background: #e6ecf5; padding: 14px 12px; border-radius: 14px; box-shadow: 4px 4px 9px #c5d0e0, -4px -4px 9px #ffffff; cursor: pointer; text-align: center;">
            <div style="font-size: 22px; margin-bottom: 6px;">🟢</div>
            <div style="font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 3px;">Deployments</div>
            <div style="font-size: 10.5px; color: #64748b; line-height: 1.3;">Check service health & logs</div>
        </div>

        <!-- Repo Tree Shortcut -->
        <div class="hub-card" onclick="window.KuyaB && window.KuyaB.openTreeView ? window.KuyaB.openTreeView() : null" style="background: #e6ecf5; padding: 14px 12px; border-radius: 14px; box-shadow: 4px 4px 9px #c5d0e0, -4px -4px 9px #ffffff; cursor: pointer; text-align: center;">
            <div style="font-size: 22px; margin-bottom: 6px;">🌳</div>
            <div style="font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 3px;">Repo Tree</div>
            <div style="font-size: 10.5px; color: #64748b; line-height: 1.3;">Browse repository structure</div>
        </div>
    </div>
</div>
