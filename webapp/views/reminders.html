<div id="remindersPage" style="display: none;">
    <div class="top-bar">
        <button type="button" class="btn-icon-back" id="remindersBackButton">←</button>
        <h2>⏰ Reminders</h2>
        <button type="button" class="btn-icon-add" id="addReminderButton">+</button>
    </div>
    <div class="form-box" id="reminderForm" style="display: none;">
        <input type="text" class="neu-input" id="reminderTitle" placeholder="Reminder text...">
        <div class="form-actions">
            <button type="button" class="btn-soft cancel" id="cancelReminderButton">Cancel</button>
            <button type="button" class="btn-soft save" id="saveReminderButton">Save</button>
        </div>
    </div>
    <div id="remindersList"></div>
</div>
