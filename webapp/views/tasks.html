<div id="tasksPage" style="display: none;">
    <div class="top-bar">
        <button type="button" class="btn-icon-back" id="tasksBackButton">←</button>
        <h2>✅ Tasks</h2>
        <button type="button" class="btn-icon-add" id="addTaskButton">+</button>
    </div>
    <div class="form-box" id="taskForm" style="display: none;">
        <input type="text" class="neu-input" id="taskTitle" placeholder="Task description...">
        <div class="form-actions">
            <button type="button" class="btn-soft cancel" id="cancelTaskButton">Cancel</button>
            <button type="button" class="btn-soft save" id="saveTaskButton">Save</button>
        </div>
    </div>
    <div id="tasksList"></div>
</div>
