<div id="adminUpdaterPage" style="display: none; padding-bottom: 30px;">
    <div class="top-bar">
        <button type="button" class="btn-icon-back" id="adminUpdaterBackButton">←</button>
        <h2>⚡ File Committer</h2>
        <button type="button" class="btn-icon-add" onclick="window.KuyaB.loadRepoTree(true)" title="Refresh file list">🔄</button>
    </div>

    <div class="form-box" style="display: block; margin-top: 14px; position: relative;">
        <!-- Search File Autocomplete -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="font-size: 0.82rem; font-weight: 600; color: #64748b;">Search File Name</label>
            <span id="repoScanStatus" style="font-size: 0.75rem; color: #2563eb; font-weight: 600;"></span>
        </div>

        <div style="position: relative; margin-bottom: 14px; z-index: 50;">
            <input 
                type="text" 
                class="neu-input" 
                id="fileSearchInput" 
                placeholder="Type file name (e.g. tracking, vault, app)..." 
                autocomplete="off"
                oninput="window.KuyaB.filterRepoFiles(this.value)"
                onfocus="window.KuyaB.filterRepoFiles(this.value)"
                style="width: 100%; box-sizing: border-box;"
            >
            <!-- Floating Autocomplete Dropdown -->
            <div id="fileSuggestionsList" style="
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                max-height: 220px;
                overflow-y: auto;
                background: #f1f5f9;
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.18), inset 1px 1px 2px #ffffff;
                z-index: 9999;
                margin-top: 6px;
                border: 1px solid #cbd5e1;
                box-sizing: border-box;
            "></div>
        </div>

        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Target File Path</label>
        <input type="text" class="neu-input" id="commitFilePath" placeholder="e.g. webapp/modules/tracking.js" style="margin-bottom: 14px;">

        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Commit Message</label>
        <input type="text" class="neu-input" id="commitMsgInput" placeholder="e.g. Fix user activity counter" style="margin-bottom: 14px;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="font-size: 0.82rem; font-weight: 600; color: #64748b;">New File Content</label>
            <span id="fileLoadStatus" style="font-size: 0.75rem; color: #2563eb; font-weight: 600;"></span>
        </div>
        <textarea class="neu-input" id="commitContentInput" placeholder="Select a file above or paste new code here..." rows="13" style="font-family: monospace; font-size: 0.8rem; line-height: 1.4; white-space: pre;"></textarea>

        <div class="form-actions" style="margin-top: 16px;">
            <button type="button" class="btn-soft cancel" id="cancelAdminUpdaterButton">Cancel</button>
            <button type="button" class="btn-soft save" id="btnSubmitCommit" onclick="window.KuyaB.submitFileCommit()">Commit & Deploy 🚀</button>
        </div>
    </div>
</div>
