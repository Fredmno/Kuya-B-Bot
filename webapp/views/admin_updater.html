<div id="adminUpdaterPage" style="display: none; padding-bottom: 30px;">
    <div class="top-bar">
        <button type="button" class="btn-icon-back" id="adminUpdaterBackButton">←</button>
        <h2>⚡ File Committer</h2>
        <button type="button" class="btn-icon-add" onclick="window.KuyaB.loadRepoTree()" title="Refresh file list">🔄</button>
    </div>

    <div class="form-box" style="display: block; margin-top: 14px;">
        <!-- Search & Filter Input with Floating Dropdown List -->
        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">
            Search File Name
        </label>
        <div style="position: relative; margin-bottom: 14px;">
            <input 
                type="text" 
                class="neu-input" 
                id="fileSearchInput" 
                placeholder="Type to filter repository files..." 
                autocomplete="off"
                oninput="window.KuyaB.filterRepoFiles(this.value)"
                onfocus="window.KuyaB.filterRepoFiles(this.value)"
                style="width: 100%; box-sizing: border-box;"
            >
            <!-- Filter Suggestions Dropdown -->
            <div id="fileSuggestionsList" style="
                display: none;
                position: absolute;
                top: calc(100% + 4px);
                left: 0;
                right: 0;
                max-height: 220px;
                overflow-y: auto;
                background: #eef2f7;
                border-radius: 12px;
                box-shadow: 6px 6px 14px #cad5e2, -6px -6px 14px #ffffff;
                z-index: 100;
                padding: 6px 0;
                box-sizing: border-box;
            "></div>
        </div>

        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Target File Path</label>
        <input type="text" class="neu-input" id="commitFilePath" placeholder="e.g. webapp/views/new_view.html" style="margin-bottom: 14px;">

        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Commit Message</label>
        <input type="text" class="neu-input" id="commitMsgInput" placeholder="e.g. Update dashboard button" style="margin-bottom: 14px;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="font-size: 0.82rem; font-weight: 600; color: #64748b;">New File Content</label>
            <span id="fileLoadStatus" style="font-size: 0.75rem; color: #2563eb; font-weight: 600;"></span>
        </div>
        <textarea class="neu-input" id="commitContentInput" placeholder="Select a file above or paste new code here..." rows="13" style="font-family: monospace; font-size: 0.8rem; line-height: 1.4; white-space: pre;"></textarea>

        <div class="form-actions" style="margin-top: 16px;">
            <button type="button" class="btn-soft cancel" id="cancelAdminUpdaterButton">Cancel</button>
            <button type="button" class="btn-soft save" id="btnSubmitCommit" onclick="window.KuyaB.submitFileCommit()">Commit & Deploy 🚀</button>
        </div>
    </div>
</div>
