<!-- IN-APP MEDIA VIEWER MODAL (LIGHTBOX FOR PICS & VIDS) -->
<div id="mediaViewerModal" class="modal-overlay" style="display: none; align-items: center; justify-content: center;" onclick="if(event.target===this) window.KuyaB.closeMediaModal()">
    <div class="modal-card" style="max-width: 92%; padding: 14px; text-align: center; border-radius: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span id="mediaModalTitle" style="font-weight: 700; font-size: 1rem;">View Media</span>
            <button type="button" class="btn-soft cancel" style="padding: 4px 10px; font-size: 0.85rem;" onclick="window.KuyaB.closeMediaModal()">✕</button>
        </div>
        <div id="mediaModalContainer" style="min-height: 220px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 12px; overflow: hidden;">
            <img id="mediaModalImage" src="" alt="Vault Picture" style="max-width: 100%; max-height: 65vh; object-fit: contain; display: none;">
            <video id="mediaModalVideo" controls playsinline style="max-width: 100%; max-height: 65vh; display: none; border-radius: 8px;"></video>
            <div id="mediaLoadingSpinner" style="color: #fff; font-size: 0.9rem;">Loading media...</div>
        </div>
    </div>
</div>

<!-- STANDALONE ADD BIRTHDAY POPUP VIEW -->
<div id="addBirthdayStandalonePage" style="display: none; padding: 24px 16px;">
    <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 6px;">🎂 Add Birthday</h2>
        <p style="color: var(--text-muted, #64748b); font-size: 0.88rem;">Save directly to your permanent registry</p>
    </div>
    <div class="form-box" style="display: block; padding: 20px;">
        <input type="text" class="neu-input" id="popupBirthdayName" placeholder="Full Name" style="margin-bottom: 14px;">
        <input type="text" class="neu-input" id="popupBirthdayDate" placeholder="Date (MM-DD, e.g. 10-25)" maxlength="5" style="margin-bottom: 20px;">
        <div class="form-actions" style="display: flex; gap: 12px;">
            <button type="button" class="btn-soft cancel" style="flex: 1;" onclick="if(window.Telegram && Telegram.WebApp) Telegram.WebApp.close();">Cancel</button>
            <button type="button" class="btn-soft save" id="btnPopupSaveBirthday" style="flex: 1;" onclick="window.saveBirthdayFromPopup()">Save</button>
        </div>
    </div>
</div>

<!-- DETAIL MODAL FOR LOGS -->
<div id="logDetailModal" class="modal-overlay" style="display: none;" onclick="if(event.target===this) window.KuyaB.features.dailyLogs.closeModal()">
    <div class="modal-card">
        <div class="modal-header">
            <span class="modal-emoji" id="modalLogEmoji">😊</span>
            <div>
                <div class="modal-date" id="modalLogDate"></div>
                <div class="modal-sub" id="modalHabitsCount"></div>
            </div>
        </div>
        <div id="modalHabitsSection" style="display: none;">
            <div class="modal-section-title">Completed Habits:</div>
            <div class="modal-habits-list" id="modalHabitsList"></div>
        </div>
        <div class="modal-section-title" style="margin-top: 8px;">Reflection:</div>
        <div class="modal-body" id="modalLogContent"></div>
        <div class="form-actions">
            <button type="button" class="btn-soft cancel" style="width: 100%;" onclick="window.KuyaB.features.dailyLogs.closeModal()">Close</button>
        </div>
    </div>
</div>
