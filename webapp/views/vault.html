        <!-- VAULT PAGE (PICTURES, VIDEOS, OTHER) -->
        <div id="vaultPage" style="display: none;">
            <div class="top-bar">
                <button type="button" class="btn-icon-back" id="vaultBackButton">←</button>
                <h2 id="vaultPageTitle">📁 Vault</h2>
                <button type="button" class="btn-icon-add" id="addVaultItemButton">+</button>
            </div>

            <!-- "OTHER" FOLDER APPS GRID (4 Columns in 1 Row) -->
            <div id="otherActionsBar" style="padding: 0 16px 20px 16px; display: none;">
                <div class="section-title" style="margin-bottom: 12px;">Apps & Tools</div>
                
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
                    <!-- 1. Word Scramble Game Tile -->
                    <div class="feature-card" id="gameButton" style="padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer;">
                        <span class="card-icon" style="font-size: 1.6rem; margin-bottom: 6px;">🎮</span>
                        <span class="card-title" style="font-size: 0.76rem; font-weight: 600; line-height: 1.2;">Game</span>
                    </div>

                    <!-- 2. File Committer Tile -->
                    <div class="feature-card" id="btnAdminUpdater" style="padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer;">
                        <span class="card-icon" style="font-size: 1.6rem; margin-bottom: 6px;">🚀</span>
                        <span class="card-title" style="font-size: 0.76rem; font-weight: 600; line-height: 1.2;">Commit</span>
                    </div>

                    <!-- 3. User Activity Tile -->
                    <div class="feature-card" id="btnOpenUserTracking" style="padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer;">
                        <span class="card-icon" style="font-size: 1.6rem; margin-bottom: 6px;">👥</span>
                        <span class="card-title" style="font-size: 0.76rem; font-weight: 600; line-height: 1.2;">Activity</span>
                    </div>

                    <!-- 4. Future Slot (Placeholder / Ready for your next tool) -->
                    <div class="feature-card" id="btnDeployStatus" style="padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; opacity: 0.85;">
                        <span class="card-icon" style="font-size: 1.6rem; margin-bottom: 6px;">⚡</span>
                        <span class="card-title" style="font-size: 0.76rem; font-weight: 600; line-height: 1.2;">Status</span>
                    </div>
                </div>
            </div>

            <!-- Upload Media / Add Content Form -->
            <form id="vaultUploadForm" class="form-box" style="display: none;">
                <input type="text" class="neu-input" id="vaultItemTitle" placeholder="Title / Caption" style="margin-bottom: 12px;">
                <input type="text" class="neu-input" id="vaultItemFolder" placeholder="Folder (e.g. Work, Trips, Receipts)" style="margin-bottom: 12px;">
                <input type="file" class="neu-input" id="vaultItemFile" accept="image/*,video/*" style="margin-bottom: 16px;">
                <div class="form-actions">
                    <button type="button" class="btn-soft cancel" id="cancelVaultItemButton">Cancel</button>
                    <button type="button" class="btn-soft save" id="btnUploadMedia">Upload</button>
                </div>
            </form>

            <div id="vaultItemsList"></div>
        </div>
