<div id="addContentPage" style="display: none; padding-bottom: 30px;">
    <!-- Top Bar -->
    <div class="top-bar">
        <button type="button" class="btn-icon-back" id="addContentBackButton">←</button>
        <h2>+ Add Content</h2>
        <div style="width: 40px;"></div>
    </div>

    <!-- Mode Selector Tabs -->
    <div style="display: flex; gap: 8px; margin-top: 14px; margin-bottom: 10px;">
        <button type="button" id="tabUploadFile" class="btn-soft save" style="flex: 1; padding: 8px; font-size: 0.82rem;" onclick="window.KuyaB.switchAddContentMode('file')">📁 Upload File</button>
        <button type="button" id="tabDownloadLink" class="btn-soft cancel" style="flex: 1; padding: 8px; font-size: 0.82rem;" onclick="window.KuyaB.switchAddContentMode('link')">🔗 From Link</button>
    </div>

    <form id="standaloneAddContentForm" class="form-box" style="display: block; margin-top: 6px;">
        <!-- Common Inputs -->
        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Target Folder</label>
        <input type="text" class="neu-input" id="newContentFolder" placeholder="e.g. Highlights, Reels, Downloads" style="margin-bottom: 14px;">

        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Title or Caption (Optional)</label>
        <input type="text" class="neu-input" id="newContentTitle" placeholder="e.g. Vacation Reel" style="margin-bottom: 14px;">

        <!-- 1. FILE UPLOAD MODE -->
        <div id="uploadFileSection">
            <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Select Category</label>
            <select class="neu-input" id="newContentSection" style="margin-bottom: 14px; width: 100%; height: 44px; padding: 0 10px;">
                <option value="pictures">🖼️ Pictures Vault</option>
                <option value="videos">🎥 Videos Vault</option>
                <option value="other">📁 Other Vault</option>
            </select>

            <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Choose File / Video</label>
            <div style="position: relative; margin-bottom: 16px;">
                <input type="file" id="newContentFile" accept="image/*,video/*" style="opacity: 0; position: absolute; z-index: -1; width: 0.1px; height: 0.1px; overflow: hidden;">
                <label for="newContentFile" style="
                    display: flex;
                    align-center;
                    gap: 12px;
                    width: 100%;
                    padding: 8px 10px;
                    border-radius: 14px;
                    background: #e6ecf5;
                    box-shadow: inset 3px 3px 6px #cad5e2, inset -3px -3px 6px #ffffff;
                    cursor: pointer;
                    box-sizing: border-box;
                ">
                    <span style="
                        background: #2563eb;
                        color: #ffffff;
                        font-size: 0.82rem;
                        font-weight: 600;
                        padding: 8px 14px;
                        border-radius: 10px;
                        box-shadow: 2px 2px 5px rgba(37, 99, 235, 0.35);
                        white-space: nowrap;
                    ">Browse File</span>
                    <span id="newContentFileName" style="
                        font-size: 0.88rem;
                        color: #64748b;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                    ">No file chosen</span>
                </label>
            </div>
        </div>

        <!-- 2. LINK DOWNLOAD MODE -->
        <div id="downloadLinkSection" style="display: none;">
            <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">Media Link / URL</label>
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="url" class="neu-input" id="downloadMediaUrl" placeholder="Paste YouTube, TikTok, IG, or direct link..." style="margin-bottom: 0;">
                <button type="button" onclick="window.KuyaB.pasteDownloadUrl()" style="
                    border: none;
                    background: #2563eb;
                    color: #ffffff;
                    padding: 0 14px;
                    border-radius: 12px;
                    font-size: 0.82rem;
                    font-weight: 600;
                    cursor: pointer;
                    white-space: nowrap;
                ">📋 Paste</button>
            </div>
        </div>

        <!-- Live Upload / Processing Bar -->
        <div id="uploadProgressContainer" style="display: none; width: 100%; margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: #64748b; margin-bottom: 6px;">
                <span id="uploadStatusText">Uploading...</span>
                <span id="uploadPercentText">0%</span>
            </div>
            <div style="
                width: 100%;
                height: 10px;
                background: #dbe4f0;
                border-radius: 999px;
                overflow: hidden;
                box-shadow: inset 1px 1px 3px rgba(0,0,0,0.15);
            ">
                <div id="uploadProgressBar" style="
                    width: 0%;
                    height: 100%;
                    background: linear-gradient(90deg, #3b82f6, #2563eb);
                    border-radius: 999px;
                    transition: width 0.15s ease;
                "></div>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-soft cancel" id="cancelAddContentButton">Cancel</button>
            <button type="button" class="btn-soft save" id="btnSubmitAddContent" onclick="window.KuyaB.submitAddContentAction()">Upload Content</button>
        </div>
    </form>
</div>
